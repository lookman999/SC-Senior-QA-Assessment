name: Assessment checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-${{ github.ref }}
  cancel-in-progress: false # Allow teardown to finish for stateful test runs.

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-09-24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-09-24
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:guards
      - run: npm test
        env:
          CI: 'true'
          WORKERS: '1'
          CAPTURE_TRACE: '0'
      - name: Recover interrupted test accounts
        if: always()
        run: npm run cleanup
      # Console output is sufficient for a public submission. No automatic upload of cookies,
      # screenshots or recovery records; inspect report contents before sharing them.
